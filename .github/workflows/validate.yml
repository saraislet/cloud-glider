name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Observer dependencies
        run: python -m pip install -r observer/requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint
      - name: Lint CloudFormation
        run: cfn-lint cfn/foundation.yaml cfn/generation.yaml
