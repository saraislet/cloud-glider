AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: Isolated Cloud Glider candidate AMI smoke test; never starts propagation.
Parameters:
  CandidateImageId:
    Type: AWS::EC2::Image::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0a00b98420d660d03
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0da9cdee2a98d8dc2
  ExpectedAgentSha256:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
Rules:
  SandboxRegion:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-west-2]
        AssertDescription: Smoke tests run only in us-west-2.
Resources:
  SmokeResultHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
  SmokeResult:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: TestInstance
    Properties:
      Handle: !Ref SmokeResultHandle
      Timeout: '600'
      Count: 1
  TestInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref CandidateImageId
      InstanceType: t4g.micro
      # No instance profile: this test cannot read or mutate propagation state.
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Monitoring: false
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet: [!Ref SecurityGroupId]
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 2
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: project
          Value: cloud-glider
        - Key: purpose
          Value: image-smoke-test
        - Key: Name
          Value: cloud-glider-image-smoke-test
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/cloud-glider-smoke.log /dev/console) 2>&1
          signal_result() {
            /usr/bin/python3 - '${SmokeResultHandle}' "$1" <<'PYRESULT'
          import json, sys, urllib.request
          from pathlib import Path
          status = sys.argv[2]
          evidence = Path('/var/log/cloud-glider-smoke-result.log')
          lines = evidence.read_text().splitlines() if evidence.exists() else []
          result = next((json.loads(line) for line in reversed(lines) if line.startswith('{"result":')), {})
          if status == 'SUCCESS' and result.get('result') != 'CLOUD_GLIDER_AMI_SMOKE_PASS':
              raise SystemExit('missing explicit smoke result')
          body = json.dumps({'Status': status, 'Reason': 'Isolated baked-runtime smoke checks',
                             'UniqueId': 'runtime', 'Data': json.dumps(result)}).encode()
          request = urllib.request.Request(sys.argv[1], data=body, method='PUT',
                                           headers={'Content-Type': ''})
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit('smoke result delivery failed')
          PYRESULT
          }
          trap 'echo CLOUD_GLIDER_AMI_SMOKE_FAIL; signal_result FAILURE' ERR
          /opt/cloud-glider/venv/bin/python /usr/local/lib/cloud-glider/smoke_test.py --expected-sha256 '${ExpectedAgentSha256}' | tee /var/log/cloud-glider-smoke-result.log
          signal_result SUCCESS
          # Bound successful-test spend. Delete this stack after collecting evidence.
          shutdown -h now
Outputs:
  SmokeResultData:
    Value:
      Fn::ToJsonString: !GetAtt SmokeResult.Data
  InstanceId:
    Value: !Ref TestInstance
