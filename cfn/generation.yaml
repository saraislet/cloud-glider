AWSTemplateFormatVersion: '2010-09-09'
Description: One Cloud Glider generation instance; contains no IAM or networking resources.

Parameters:
  Environment:
    Type: String
    Default: sandbox
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
  Owner:
    Type: String
    MinLength: 1
    MaxLength: 64
  Generation:
    Type: String
    AllowedPattern: '^[0-9]{6}$'
  PredecessorStackId:
    Type: String
    Default: NONE
    MaxLength: 1024
  HandoffToken:
    Type: String
    Default: OPERATOR_BOOTSTRAP
    MinLength: 1
    MaxLength: 128
  ApprovedImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-08dd4258d4d19fe06
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues: [t4g.micro]
  ImageArchitecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64]
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0a00b98420d660d03
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0da9cdee2a98d8dc2
  AgentInstanceProfileName:
    Type: String
  StateTableName:
    Type: String
  AgentArtifactBucket:
    Type: String
  AgentArtifactKey:
    Type: String
    AllowedPattern: '^generation/.+$'
  AgentArtifactVersionId:
    Type: String
    MinLength: 1
  AgentArtifactSha256:
    Type: String
    AllowedPattern: '^[A-Fa-f0-9]{64}$'
  BootstrapVersion:
    Type: String
    MinLength: 1
    MaxLength: 128
  TemplateVersion:
    Type: String
    MinLength: 1
    MaxLength: 128
  TemplateBucket:
    Type: String
    MinLength: 3
  TemplateKey:
    Type: String
    AllowedPattern: '^generation/.+$'
  TemplateS3VersionId:
    Type: String
    MinLength: 1
  TemplateSha256:
    Type: String
    AllowedPattern: '^[A-Fa-f0-9]{64}$'
  TemplateBuildId:
    Type: String
    MinLength: 7
    MaxLength: 128
  PropagationAuditLogGroupName:
    Type: String
  AgentOperationsLogGroupName:
    Type: String
  EmergencyHoldFunctionName:
    Type: String
  OperationalAlertsTopicArn:
    Type: String
    AllowedPattern: '^arn:[a-z0-9-]+:sns:us-west-2:[0-9]{12}:cloud-glider-[a-z][a-z0-9-]{1,15}-operational-alerts$'
    Description: Foundation SNS topic ARN for generation health notifications.
  RootDeviceName:
    Type: String
    Default: /dev/xvda
    AllowedValues: [/dev/xvda, /dev/sda1]
  RootVolumeGiB:
    Type: Number
    Default: 8
    MinValue: 8
    MaxValue: 16

Rules:
  SandboxRegionIsUsWest2:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-west-2]
        AssertDescription: Cloud Glider's initial sandbox is restricted to us-west-2.
  SandboxArchitectureIsArm64:
    Assertions:
      - Assert: !Equals [!Ref ImageArchitecture, arm64]
        AssertDescription: Cloud Glider's initial sandbox requires a prevalidated arm64 AMI.

Resources:
  GenerationInstance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ImageId: !Ref ApprovedImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref AgentInstanceProfileName
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
        HttpTokens: required
        InstanceMetadataTags: enabled
      Monitoring: true
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref SecurityGroupId
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: !Ref RootDeviceName
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeGiB
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub 'cloud-glider-${Environment}-gen-${Generation}'
        - Key: project
          Value: cloud-glider
        - Key: environment
          Value: !Ref Environment
        - Key: generation
          Value: !Ref Generation
        - Key: owner
          Value: !Ref Owner
        - Key: purpose
          Value: generation-compute
        - Key: template-version
          Value: !Ref TemplateVersion
        - Key: template-sha256
          Value: !Ref TemplateSha256
        - Key: template-build-id
          Value: !Ref TemplateBuildId
        - Key: bootstrap-version
          Value: !Ref BootstrapVersion
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          install -d -m 0750 /etc/cloud-glider /opt/cloud-glider
          cat >/etc/cloud-glider/bootstrap.json <<'JSON'
          {
            "environment": "${Environment}",
            "generation": "${Generation}",
            "stack_id": "${AWS::StackId}",
            "predecessor_stack_id": "${PredecessorStackId}",
            "handoff_token": "${HandoffToken}",
            "state_table_name": "${StateTableName}",
            "bootstrap_version": "${BootstrapVersion}",
            "template_version": "${TemplateVersion}",
            "template_bucket": "${TemplateBucket}",
            "template_key": "${TemplateKey}",
            "template_s3_version_id": "${TemplateS3VersionId}",
            "template_sha256": "${TemplateSha256}",
            "template_build_id": "${TemplateBuildId}",
            "agent_artifact_bucket": "${AgentArtifactBucket}",
            "agent_artifact_key": "${AgentArtifactKey}",
            "agent_artifact_version_id": "${AgentArtifactVersionId}",
            "agent_artifact_sha256": "${AgentArtifactSha256}",
            "propagation_audit_log_group": "${PropagationAuditLogGroupName}",
            "agent_operations_log_group": "${AgentOperationsLogGroupName}",
            "emergency_hold_function_name": "${EmergencyHoldFunctionName}"
          }
          JSON
          chmod 0640 /etc/cloud-glider/bootstrap.json
          aws s3api get-object \
            --bucket '${AgentArtifactBucket}' \
            --key '${AgentArtifactKey}' \
            --version-id '${AgentArtifactVersionId}' \
            /opt/cloud-glider/agent.tar.gz
          echo '${AgentArtifactSha256}  /opt/cloud-glider/agent.tar.gz' | sha256sum -c -
          tar -xzf /opt/cloud-glider/agent.tar.gz -C /opt/cloud-glider
          test -x /opt/cloud-glider/bin/cloud-glider
          cat >/etc/systemd/system/cloud-glider.service <<'UNIT'
          [Unit]
          Description=Cloud Glider propagation agent
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/opt/cloud-glider/bin/cloud-glider --config /etc/cloud-glider/bootstrap.json
          Restart=on-failure
          RestartSec=15
          Environment=PYTHONUNBUFFERED=1
          User=root
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/cloud-glider

          [Install]
          WantedBy=multi-user.target
          UNIT
          install -d -m 0750 /var/lib/cloud-glider
          systemctl daemon-reload
          systemctl enable --now cloud-glider.service

  GenerationStatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'cloud-glider-${Environment}-gen-${Generation}-status-check'
      AlarmDescription: !Sub 'Generation ${Generation} failed an EC2 system or instance status check.'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref GenerationInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref OperationalAlertsTopicArn

Outputs:
  InstanceId:
    Value: !Ref GenerationInstance
  Generation:
    Value: !Ref Generation
  StatusCheckAlarmName:
    Value: !Ref GenerationStatusCheckAlarm
  TemplateVersion:
    Value: !Ref TemplateVersion
  TemplateS3VersionId:
    Value: !Ref TemplateS3VersionId
  TemplateSha256:
    Value: !Ref TemplateSha256
  TemplateBuildId:
    Value: !Ref TemplateBuildId
