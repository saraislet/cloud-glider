AWSTemplateFormatVersion: '2010-09-09'
Description: Operator seed instance from the persistent launch template; propagation uses direct EC2 APIs.

Parameters:
  CycleConfiguration:
    Type: String
    Default: ""
    MaxLength: 4096
  ConfigurationSha256:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9a-f]{64}$"
  LaunchTemplateId:
    Type: String
    AllowedPattern: '^lt-[0-9a-f]{17}$'
  LaunchTemplateVersion:
    Type: String
    AllowedPattern: '^[1-9][0-9]*$'
  Environment:
    Type: String
    Default: sandbox
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
  Owner:
    Type: String
    MinLength: 1
    MaxLength: 64
  RequestId:
    Type: String
    AllowedPattern: '^[1-9][0-9]{0,17}$'
  Generation:
    Type: String
    AllowedPattern: '^[0-9]{6}$'
  PredecessorStackId:
    Type: String
    Default: NONE
    MaxLength: 1024
  HandoffToken:
    Type: String
    Default: OPERATOR_BOOTSTRAP
    MinLength: 1
    MaxLength: 128
  ApprovedImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-08dd4258d4d19fe06
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues: [t4g.micro]
  ImageArchitecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64]
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0a00b98420d660d03
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0da9cdee2a98d8dc2
  DaemonInstanceProfileName:
    Type: String
  GenerationTableName:
    Type: String
    AllowedPattern: '^cloud-glider-[a-z][a-z0-9-]{1,15}-generations$'
  StateTableName:
    Type: String
  DaemonArtifactBucket:
    Type: String
  DaemonArtifactKey:
    Type: String
    AllowedPattern: '^generation/.+$'
  DaemonArtifactVersionId:
    Type: String
    MinLength: 1
  DaemonArtifactSha256:
    Type: String
    AllowedPattern: '^[A-Fa-f0-9]{64}$'
  BootstrapVersion:
    Type: String
    MinLength: 1
    MaxLength: 128
  TemplateVersion:
    Type: String
    MinLength: 1
    MaxLength: 128
  TemplateBucket:
    Type: String
    MinLength: 3
  TemplateKey:
    Type: String
    AllowedPattern: '^generation/.+$'
  TemplateS3VersionId:
    Type: String
    MinLength: 1
  TemplateSha256:
    Type: String
    AllowedPattern: '^[A-Fa-f0-9]{64}$'
  TemplateBuildId:
    Type: String
    MinLength: 7
    MaxLength: 128
  PropagationAuditLogGroupName:
    Type: String
  DaemonOperationsLogGroupName:
    Type: String
  EmergencyHoldFunctionName:
    Type: String
  OperationalAlertsTopicArn:
    Type: String
    AllowedPattern: '^arn:[a-z0-9-]+:sns:us-west-2:[0-9]{12}:cloud-glider-[a-z][a-z0-9-]{1,15}-operational-alerts$'
    Description: Foundation SNS topic ARN for generation health notifications.
  DaemonDeliveryMode:
    Type: String
    Default: baked
    AllowedValues: [baked]
  RootDeviceName:
    Type: String
    Default: /dev/sda1
    AllowedValues: [/dev/sda1]
  RootVolumeGiB:
    Type: Number
    Default: 2
    AllowedValues: [2]

Rules:
  SandboxRegionIsUsWest2:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-west-2]
        AssertDescription: Cloud Glider's initial sandbox is restricted to us-west-2.
  SandboxArchitectureIsArm64:
    Assertions:
      - Assert: !Equals [!Ref ImageArchitecture, arm64]
        AssertDescription: Cloud Glider's initial sandbox requires a prevalidated arm64 AMI.

Conditions:
  HasInheritedConfiguration: !Not [!Equals [!Ref CycleConfiguration, ""]]

Resources:
  GenerationInstance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      ApprovedSeedInputs:
        ApprovedImageId: !Ref ApprovedImageId
        InstanceType: !Ref InstanceType
        SubnetId: !Ref SubnetId
        SecurityGroupId: !Ref SecurityGroupId
        DaemonInstanceProfileName: !Ref DaemonInstanceProfileName
        GenerationTableName: !Ref GenerationTableName
        StateTableName: !Ref StateTableName
        DaemonArtifactBucket: !Ref DaemonArtifactBucket
        DaemonArtifactKey: !Ref DaemonArtifactKey
        DaemonArtifactVersionId: !Ref DaemonArtifactVersionId
        DaemonArtifactSha256: !Ref DaemonArtifactSha256
        TemplateBucket: !Ref TemplateBucket
        TemplateKey: !Ref TemplateKey
        TemplateS3VersionId: !Ref TemplateS3VersionId
        PropagationAuditLogGroupName: !Ref PropagationAuditLogGroupName
        DaemonOperationsLogGroupName: !Ref DaemonOperationsLogGroupName
        EmergencyHoldFunctionName: !Ref EmergencyHoldFunctionName
        DaemonDeliveryMode: !Ref DaemonDeliveryMode
        RootDeviceName: !Ref RootDeviceName
        RootVolumeGiB: !Ref RootVolumeGiB
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplateId
        Version: !Ref LaunchTemplateVersion
      UserData: !If
        - HasInheritedConfiguration
        - Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            test "$(uname -m)" = "aarch64"
            install -d -m 0750 /etc/cloud-glider /opt/cloud-glider
            cat >/etc/cloud-glider/bootstrap.json <<'JSON'
            {
              "propagation_backend": "ec2",
              "inherited_configuration": ${CycleConfiguration},
              "daemon_delivery_mode": "baked",
              "generation_table_name": "${GenerationTableName}",
              "environment": "${Environment}",
              "owner": "${Owner}",
              "operational_alerts_topic_arn": "${OperationalAlertsTopicArn}",
              "state_table_name": "${StateTableName}",
              "bootstrap_version": "${BootstrapVersion}",
              "template_version": "${TemplateVersion}",
              "template_bucket": "${TemplateBucket}",
              "template_key": "${TemplateKey}",
              "template_s3_version_id": "${TemplateS3VersionId}",
              "template_sha256": "${TemplateSha256}",
              "template_build_id": "${TemplateBuildId}",
              "daemon_artifact_bucket": "${DaemonArtifactBucket}",
              "daemon_artifact_key": "${DaemonArtifactKey}",
              "daemon_artifact_version_id": "${DaemonArtifactVersionId}",
              "daemon_artifact_sha256": "${DaemonArtifactSha256}",
              "propagation_audit_log_group": "${PropagationAuditLogGroupName}",
              "daemon_operations_log_group": "${DaemonOperationsLogGroupName}",
              "emergency_hold_function_name": "${EmergencyHoldFunctionName}"
            }
            JSON
            chmod 0640 /etc/cloud-glider/bootstrap.json
            test -f /etc/cloud-glider/image.json
            test -x /opt/cloud-glider/venv/bin/python
            /usr/bin/python3 /usr/local/lib/cloud-glider/verify_image.py --config /etc/cloud-glider/bootstrap.json --context user_data
            install -d -m 0750 /var/lib/cloud-glider
            systemctl enable --now cloud-glider.service

        - !Ref AWS::NoValue
      Tags:
        - Key: bootstrap-request-id
          Value: !Ref RequestId
        - Key: propagation-backend
          Value: ec2
        - Key: predecessor-instance-id
          Value: !Ref PredecessorStackId
        - Key: handoff-token
          Value: !Ref HandoffToken
        - Key: node-path
          Value: r
        - Key: configuration-sha256
          Value: !Ref ConfigurationSha256
        - Key: Name
          Value: !If [HasInheritedConfiguration, !Sub 'cloud-glider-${Environment}-${RequestId}-r', !Sub 'cloud-glider-${Environment}-gen-${Generation}']
        - Key: project
          Value: cloud-glider
        - Key: environment
          Value: !Ref Environment
        - Key: generation
          Value: !Ref Generation
        - Key: owner
          Value: !Ref Owner
        - Key: purpose
          Value: generation-compute
        - Key: template-version
          Value: !Ref TemplateVersion
        - Key: template-sha256
          Value: !Ref TemplateSha256
        - Key: template-build-id
          Value: !Ref TemplateBuildId
        - Key: bootstrap-version
          Value: !Ref BootstrapVersion

  GenerationStatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'cloud-glider-${Environment}-gen-${Generation}-status-check'
      AlarmDescription: !Sub 'Generation ${Generation} failed an EC2 system or instance status check.'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref GenerationInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref OperationalAlertsTopicArn

Outputs:
  InstanceId:
    Value: !Ref GenerationInstance
  RequestId:
    Value: !Ref RequestId
  Generation:
    Value: !Ref Generation
  StatusCheckAlarmName:
    Value: !Ref GenerationStatusCheckAlarm
  TemplateVersion:
    Value: !Ref TemplateVersion
  TemplateS3VersionId:
    Value: !Ref TemplateS3VersionId
  TemplateSha256:
    Value: !Ref TemplateSha256
  TemplateBuildId:
    Value: !Ref TemplateBuildId
